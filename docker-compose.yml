# Local services.
#   docker compose up -d db                 → Postgres only (make db)
#   docker compose --profile app up --build → API + web, as deployed
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kazi
      POSTGRES_PASSWORD: kazi
      POSTGRES_DB: kazi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./api/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kazi"]
      interval: 5s
      retries: 10

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    environment:
      # Paths inside the container (your .env paths are relative to api/ on
      # your machine). Without data/real/, set COMPOSE_AGENCIES_CSV to
      # /app/data/sample/agencies.csv.
      AGENCIES_CSV: ${COMPOSE_AGENCIES_CSV:-/app/data/real/agencies.csv}
      FLAGGED_CSV: ${COMPOSE_FLAGGED_CSV:-/app/data/real/flagged.csv}
      STORE: memory
      PORT: "8080"
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "8080:8080"

  web:
    profiles: ["app"]
    build:
      context: web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata: